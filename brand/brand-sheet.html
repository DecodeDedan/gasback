<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Gasback brand sheet</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>body{margin:0;padding:32px;background:#110f0c;color:#eeebe5;font-family:"IBM Plex Sans",sans-serif;display:grid;gap:32px}
.row{display:flex;gap:32px;align-items:center;flex-wrap:wrap}.sw{width:120px;height:64px;display:flex;align-items:end;padding:6px;font:12px "IBM Plex Mono",monospace}</style></head>
<body>
<div class="row"><img src="gasback-mark.svg" width="256" alt=""><img src="gasback-mark.svg" width="64" alt=""><img src="gasback-mark.svg" width="32" alt=""><img src="gasback-mark.svg" width="16" alt=""></div>
<div class="row"><img src="gasback-logo.svg" width="420" alt=""></div>
<div class="row"><div class="sw" style="background:#110f0c;outline:1px solid #383531">page #110f0c</div><div class="sw" style="background:#181612">surface #181612</div><div class="sw" style="background:#eeebe5;color:#110f0c">ink #eeebe5</div><div class="sw" style="background:#f5b53d;color:#211f1b">gas #f5b53d</div><div class="sw" style="background:#5fd37f;color:#110f0c">refund #5fd37f</div></div>
</body></html>
